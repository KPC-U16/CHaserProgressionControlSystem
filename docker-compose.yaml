services:
  app:
    build:
      # workspace の依存を解決するため、build context は monorepo のルート
      context: .
      dockerfile: chros/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CHROS_DATA_DIR=/data/chros
    volumes:
      - chros-data:/data/chros

  db:
    profiles: [database]
    image: postgres:17
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=database
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chros-data:
  db-data:
