      <rect x="365" y="171" width="272" height="92" rx="10" />
      <rect x="365" y="297" width="272" height="92" rx="10" />
      <rect x="738" y="174" width="239" height="86" rx="10" />
      <rect x="738" y="300" width="239" height="89" rx="10" />
    </g>
    <rect x="365" y="440" width="272" height="70" rx="10" fill="#172c35" />
    <g text-anchor="middle" fill="#1d2c38" font-size="21" font-weight="700">
      <text x="149" y="99">運営画面</text>
      <text x="149" y="464">会場掲示</text>
      <text x="501" y="93">API / state</text>
      <text x="501" y="205">tournament</text>
      <text x="501" y="332">store</text>
      <text x="857" y="208">scoring</text>
      <text x="857" y="335">JSON ファイル</text>
    </g>
    <g text-anchor="middle" fill="#546773" font-size="15">
      <text x="149" y="125">Console / useControl</text>
      <text x="149" y="490">Display / Board</text>
      <text x="501" y="119">入力・更新番号・Originの検証</text>
      <text x="501" y="233">大会操作・保護・操作履歴</text>
      <text x="501" y="361">保存完了後に変更を通知</text>
      <text x="857" y="235">各戦・試合・順位を計算</text>
