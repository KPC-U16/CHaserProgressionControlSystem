<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="550"
  viewBox="0 0 1000 550"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">入力から保存、掲示までのデータの流れ</title>
  <desc id="desc">
    運営画面が更新番号と操作をPOSTし、APIが検証、tournamentが進行、scoringが判定を扱います。storeがJSONへ保存した後、SSEが全状態を運営画面と会場掲示へ配信します。
  </desc>
  <rect width="1000" height="550" rx="16" fill="white" />
  <g font-family="sans-serif">
    <rect x="342" y="16" width="318" height="407" rx="16" fill="#f3f6f5" stroke="#d7e1e3" />
    <text x="501" y="43" text-anchor="middle" font-size="14" fill="#546773">
      単一の Next.js / Node プロセス
    </text>
    <g fill="#e4f2ee" stroke="#b9d4c9">
      <rect x="24" y="62" width="250" height="92" rx="10" />
      <rect x="24" y="427" width="250" height="92" rx="10" />
    </g>
    <g fill="white" stroke="#d7e1e3">
